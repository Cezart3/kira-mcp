[project]
name = "kira-mcp"
version = "0.1.0"
description = "Live search of Romanian apartment rentals for AI agents — MCP server + CLI, any city, heating & parking extracted from ad text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cezar Tocaciu" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "romania", "rentals", "real-estate", "chirii", "claude", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Romanian",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "mcp>=2,<3",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/Cezart3/kira-mcp"
Issues = "https://github.com/Cezart3/kira-mcp/issues"

[project.scripts]
kira-mcp = "kira_mcp.server:main"
kira = "kira_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kira_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/kira_mcp/server.py" = ["E501"]  # tool parameter descriptions read better on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real sites (run with KIRA_LIVE=1)"]
